<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>社内アプリ リンク集</title>
<link rel="stylesheet" href="assets/style.css" />

<!-- Apps Scriptへの接続(DNS/TLS)を先に済ませておき、実際の呼び出しを数百ms早める -->
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />

<!--
  通信まわりのスクリプトだけは<head>で読み込み、
  ログイン済みの端末では「HTMLの解析・CSSの適用を待たずに」リンク取得を開始する。
  結果は window.__sctvLinksPromise 経由で app.js が受け取る。
-->
<script src="assets/config.js"></script>
<script src="assets/sheet-api.js"></script>
<script src="assets/storage.js"></script>
<script>
  (function () {
    try {
      var pw = SctvStorage.getSavedPassword();
      if (!pw) return;
      var p = SctvSheetApi.fetchLinks(pw);
      // app.js が受け取る前に失敗しても未処理エラーにならないようにしておく
      p.catch(function () {});
      window.__sctvLinksPromise = p;
    } catch (err) {
      /* 先行取得に失敗しても、app.js が通常どおり取得し直す */
    }
  })();
</script>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="brand-bar"></div>
    <h1>社内アプリ リンク集</h1>
    <p>SCTV LINK HUB</p>
  </header>

  <!-- ログイン画面 -->
  <section id="login-screen" class="login-card" hidden>
    <h2>パスワードを入力してください</h2>
    <p class="lead">パスワードを入力すると、リンク一覧が表示されます。</p>
    <form id="login-form" autocomplete="off">
      <label class="field-label" for="password-input">パスワード</label>
      <input
        type="password"
        inputmode="numeric"
        id="password-input"
        class="password-input"
        placeholder="••••"
        autocomplete="off"
        required
      />
      <button type="submit" id="login-submit-btn" class="btn btn-primary">ログイン</button>
    </form>
    <div id="login-error" class="error-message" hidden></div>
    <p id="login-debug-hint" hidden style="text-align:center;margin:12px 0 0;">
      <a href="debug.html" class="footer-link">うまくログインできない場合は接続診断へ</a>
    </p>
  </section>

  <!-- リンク一覧画面 -->
  <main id="main-screen" hidden>
    <p id="main-loading" class="empty-note" hidden>読み込み中…</p>
    <div id="main-error" class="error-message" hidden></div>
    <p id="stale-note" class="empty-note" hidden>最新の情報を取得できませんでした。前回表示した内容を表示しています。</p>
    <button id="retry-btn" type="button" class="btn btn-secondary btn-retry" hidden>再読み込み</button>
    <p id="debug-hint" hidden style="text-align:center;">
      <a href="debug.html" class="footer-link">うまく表示されない場合は接続診断へ</a>
    </p>

    <ul id="link-list" class="link-list" hidden></ul>

    <footer class="site-footer">
      <button id="logout-btn" type="button" class="footer-link">この端末のログイン情報を削除する</button>
      <a href="admin.html" class="footer-link">管理ページへ</a>
    </footer>
  </main>

</div>

<script src="assets/app.js"></script>
</body>
</html>
